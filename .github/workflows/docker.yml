name: Build and push image

on:
  push:
    branches:
      - main
    paths:
      # This exact path is the bundle submodule gitlink, not files within bundle.
      - bundle
      - .github/workflows/docker.yml
  workflow_dispatch:
    inputs:
      accept_angular19_audit:
        description: Accept the current Angular 19 dependency audit findings for this release
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: snip-container-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main and submodules
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test CLI
        run: node --test cli/cli.test.js

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        id: dependency-audit
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Test frontend
        working-directory: frontend
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Prepare image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: ./bundle
          load: true
          tags: snip:scan

      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: snip:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Smoke test container
        shell: bash
        run: |
          docker run --detach --rm --publish 3000:3000 --name snip-smoke snip:scan
          cleanup() {
            docker stop snip-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          node scripts/smoke-test.mjs http://127.0.0.1:3000

      - name: Record accepted Angular 19 audit findings
        if: steps.dependency-audit.outcome != 'success' && inputs.accept_angular19_audit == true
        run: echo "::warning::Angular 19 dependency audit findings accepted for this manual release by ${GITHUB_ACTOR}."

      - name: Enforce dependency audit
        if: steps.dependency-audit.outcome != 'success' && inputs.accept_angular19_audit != true
        run: exit 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push verified image
        uses: docker/build-push-action@v6
        with:
          context: ./bundle
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
